name: tests

on:
  push:
    branches: [main, 'codex/**', 'evoreview-main']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evoagent_test
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EVOAGENT_TEST_DATABASE_URL: postgresql://evoagent:test-only-password@localhost:5432/evoagent_test
      EVOAGENT_TEST_REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches the current local development runtime; 3.11 is the
        # documented project target.  The evaluation corpora are kept local
        # (see .gitignore), so their tests skip cleanly here.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t evoreview:test .
      - name: Start container
        run: |
          docker run -d --name evoreview-test -p 8080:8080 \
            -e EVOAGENT_HOST=0.0.0.0 \
            -e EVOAGENT_AUTH_REQUIRED=true \
            -e EVOAGENT_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e EVOAGENT_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e EVOAGENT_BOOTSTRAP_ADMIN_PASSWORD=test-password-123 \
            evoreview:test
      - name: Wait for health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs evoreview-test
          exit 1
      - name: Smoke test API and bundled skills
        run: |
          python - <<'PY'
          import json
          import urllib.request

          request = urllib.request.Request(
              "http://127.0.0.1:8080/v1/auth/login",
              data=json.dumps({
                  "username": "admin", "password": "test-password-123",
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          token = json.load(urllib.request.urlopen(request))["access_token"]
          request = urllib.request.Request(
              "http://127.0.0.1:8080/api/skills",
              headers={"Authorization": "Bearer " + token},
          )
          skills = json.load(urllib.request.urlopen(request))["skills"]
          agent_skills = [item for item in skills if item.get("kind") == "agent-skill"]
          assert len(agent_skills) >= 9, skills
          print("agent skills:", len(agent_skills))
          PY
      - name: Stop container
        if: always()
        run: docker rm -f evoreview-test || true
