name: tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evoagent_test
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EVOAGENT_TEST_DATABASE_URL: postgresql://evoagent:test-only-password@localhost:5432/evoagent_test
      EVOAGENT_TEST_REDIS_URL: redis://localhost:6379/15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 matches the current local development runtime; 3.11 is the
        # documented project target.  The evaluation corpora are kept local
        # (see .gitignore), so their tests skip cleanly here.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
